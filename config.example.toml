# Copy to config.toml (git-ignored) and fill in.
timezone = "America/Los_Angeles"
data_dir = "data"

[ring]
camera_name = "Backyard"          # exactly as named in the Ring app
token_file = ".ring_token.json"   # created by `poolwatch ring-login`
snapshot_interval_minutes = 3     # wired, or battery on solar

[roboflow]
workspace = "your-workspace"
workflow_id = "pool-monitor"
api_url = "https://serverless.roboflow.com"   # or http://localhost:9001 for local Inference
api_key_env = "ROBOFLOW_API_KEY"   # the key itself goes in this environment variable, not here

# Optional: inputs your Workflow declares, copied from Roboflow's "Deploy" snippet.
[roboflow.parameters]
confidence = 0.4
iou_threshold = 0.3
class_agnostic_nms = false
max_detections = 1000

[omnilogic]
host = "192.168.1.50"             # controller's LAN IP
filter_name = "Filter Pump"       # run `poolwatch pump-info` to see names and ids
# filter_system_id = 7            # use this instead when two pumps share a name
dry_run = true                    # flip to false once you trust the decisions log

[notify]
# Push notifications with the free ntfy app (subscribe to this topic in the app).
# ntfy_topic = "poolwatch-some-long-random-string"

# Email alerts with the camera frame attached. For Gmail, use an app password
# (Google Account > Security > App passwords) in the POOLWATCH_SMTP_PASSWORD
# environment variable. Test with `poolwatch test-alert`.
# email_to = ["you@example.com"]
# smtp_user = "your.sender@gmail.com"
# smtp_host = "smtp.gmail.com"
# smtp_port = 587
# email_min_severity = "WARNING"   # INFO, WARNING or CRITICAL

# Polygons in image pixel coordinates, [x, y] points. Grab coordinates from a
# snapshot (Roboflow's zone tool or any image editor shows pixel positions).
[zones]
# Easiest: use the Pool Zone Picker page and paste its output over this section.
image_size = [1920, 1080]         # resolution of the frame the zones were drawn on
water = [[400, 300], [1500, 300], [1600, 900], [300, 900]]
# Areas inside the water to ignore, e.g. a built-in table. Any number of polygons.
# water_exclude = [[[1350, 320], [1480, 320], [1480, 420], [1350, 420]]]
deck  = [[150, 200], [1800, 200], [1900, 1080], [50, 1080]]
# gate = [[1700, 400], [1850, 400], [1850, 700], [1700, 700]]

# Away-from-home alerts from your calendar. In Google Calendar: Settings > your
# calendar > "Secret address in iCal format". Treat that link like a password:
# put it in the POOLWATCH_CALENDAR_ICS environment variable, not in this file.
# Check what poolwatch reads with `poolwatch away`.
[away]
enabled = false
home_terms = ["Los Angeles", "LAX"]   # how flights home are titled: city names, airport codes
keywords = ["vacation", "out of town"]  # an event with one of these in the title = away
max_trip_days = 14                      # cap when no return flight is on the calendar

[safety]
person_labels = ["person"]
min_confidence = 0.5
quiet_hours = ["21:00-07:00"]
alert_cooldown_seconds = 120

[debris]
debris_labels = ["leaf", "debris", "bug"]   # your Roboflow model's class names
min_confidence = 0.4
count_threshold = 1               # debris items on the water that make an image "dirty"
coverage_threshold_pct = 1.0      # ...or this % of the water surface covered
consecutive_readings = 2          # dirty images in a row before the pump boosts

[pump]
boost_speed_pct = 90              # boost speed
boost_minutes = 15                # then retest: still dirty -> extend, clear -> back to schedule
max_extensions = 2
cooldown_minutes = 15
max_boost_minutes_per_day = 240
no_boost_hours = ["22:00-07:00"]
